[pytest]
# Marker registration only. No `addopts`, no `testpaths`: the default full-suite
# behaviour is unchanged and every test still runs by default. The markers exist
# purely so a developer can run a subset during development, e.g.
#
#   pytest tests/test_window_closure_compare.py -m compare_unit
#
markers =
    compare_unit: pure-helper compare tests; no filesystem pipeline, no model fixture.
    compare_integration: compare tests that run against the golden model-stage tree.
    slow: tests that remain genuinely expensive (they build the golden model stage).
